# Local development stack. Not a production deployment: credentials are fixed and no
# volumes are backed up.
name: confios

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: confios
      POSTGRES_USER: confios
      POSTGRES_PASSWORD: confios
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U confios -d confios"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # OpenTelemetry collector with a built-in UI, so traces are visible without a full
  # observability stack running locally.
  jaeger:
    image: jaegertracing/all-in-one:1.62.0
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "16686:16686"
      - "4317:4317"

  api:
    build:
      context: ../..
      dockerfile: src/Api/ConfiOS.Api/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Postgres: "Host=postgres;Port=5432;Database=confios;Username=confios;Password=confios"
      ConnectionStrings__Redis: "redis:6379"
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://jaeger:4317"
      Jwt__SigningKey: "development-only-signing-key-change-me-please"
    ports:
      - "5080:8080"

volumes:
  postgres-data:
